# Render Blueprint — deploy with "New → Blueprint" after selecting this repo.
# A long-running Node web service (NOT serverless): the backend owns a
# Socket.IO gateway, which requires persistent connections.

services:
  - type: web
    name: codebot-backend
    runtime: node
    autoDeploy: true
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node dist/main.js
    # Nest HealthModule — returns 200 when the app is up.
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # Legacy public URL of this API. No longer drives BetterAuth (baseURL
      # now comes from FRONTEND_URL — see better-auth.instance.ts) but still
      # required by env validation.
      - key: APP_URL
        sync: false
      # The FRONTEND origin (https://codebotapp.onrender.com). This is where
      # users land after auth AND the public auth base: BetterAuth baseURL =
      # `${FRONTEND_URL}/api/auth`, so the OAuth redirect_uri is the FRONTEND
      # callback (`${FRONTEND_URL}/api/auth/callback/google`) and OAuth state/
      # session cookies are set same-origin via the frontend's proxy.
      - key: FRONTEND_URL
        sync: false
      # Neon PostgreSQL pooled connection (sslmode=require)
      - key: DATABASE_URL
        sync: false
      # Session/cookie/token signing key
      - key: BETTER_AUTH_SECRET
        sync: false
      # Comma-separated trusted origins — the frontend, no trailing slash
      - key: CORS_ORIGIN_URLS
        sync: false
      # First-admin bootstrap (verified users with these emails are promoted)
      - key: ADMIN_EMAIL
        sync: false
      # ── SMTP / Nodemailer ──────────────────────────────────────────────
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      # ── OAuth (optional) ───────────────────────────────────────────────
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      # ── Rate limiting ──────────────────────────────────────────────────
      - key: THROTTLE_TTL_MS
        value: "60000"
      - key: THROTTLE_LIMIT
        value: "100"
      # Optional — derived from BETTER_AUTH_SECRET when unset
      - key: SETTINGS_ENCRYPTION_KEY
        sync: false
